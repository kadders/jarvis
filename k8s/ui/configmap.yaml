apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-ui-config
  labels:
    app.kubernetes.io/name: jarvis-ui
data:
  JARVIS_UI_HOST: "0.0.0.0"
  JARVIS_UI_PORT: "8003"
  JARVIS_LLM_BASE_URL: "http://llm-api:8000"
  JARVIS_UI_LLM_TIMEOUT_S: "120"
  JARVIS_CONFIG_DIR: "/etc/jarvis/config"
  JARVIS_CONFIG_RELOAD_INTERVAL_S: "30"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-bridge
  labels:
    app.kubernetes.io/name: telemetry-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-bridge
    spec:
      containers:
        - name: telemetry-bridge
          image: jarvis_telemetry_bridge:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jarvis-telemetry-bridge-config
          volumeMounts:
            - name: telemetry-log
              mountPath: /data/telemetry
          resources:
            requests:
              memory: 128Mi
              cpu: "50m"
            limits:
              memory: 512Mi
      volumes:
        - name: telemetry-log
          emptyDir: {}

; Seeed XIAO ESP32-S3 Sense — Phase 2–3 compact station
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  fastled/FastLED @ ^3.6.0
build_flags =
  -DWAND_WIFI_SSID=\"YOUR_SSID\"
  -DWAND_WIFI_PASS=\"YOUR_PASS\"
  -DWAND_API_HOST=\"192.168.86.120\"
  -DWAND_API_PORT=8002

apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-cluster-dns
  labels:
    app.kubernetes.io/name: jarvis-cluster-dns
    app.kubernetes.io/component: lan-dns
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        log
        file /etc/coredns/jarvis.lan.zone jarvis.lan
        forward . 192.168.86.1 1.1.1.1
        cache 30
        reload 10s
    }
  jarvis.lan.zone: |
    $ORIGIN jarvis.lan.
    $TTL 60
    @   IN  SOA ns.jarvis.lan. hostmaster.jarvis.lan. (
            2026083101 ; serial
            3600       ; refresh
            600        ; retry
            86400      ; expire
            60         ; minimum
        )
        IN  NS  ns.jarvis.lan.
    ns              IN  A   192.168.86.9
    dns             IN  A   192.168.86.9
    ui              IN  A   192.168.86.6
    chat            IN  A   192.168.86.6
    mqtt            IN  A   192.168.86.7
    tap             IN  A   192.168.86.8
    tap-collector   IN  A   192.168.86.8
    oximeter        IN  A   192.168.86.12
    oximeter-collector IN  A   192.168.86.12
    llm             IN  A   192.168.86.10
    openai          IN  A   192.168.86.10
    api             IN  A   192.168.86.10

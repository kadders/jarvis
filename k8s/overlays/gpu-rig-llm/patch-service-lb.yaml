# Expose llm-api on the LAN via MetalLB (pinned IP; see docs/operations/cluster-dns.md).
# Name: llm.jarvis.lan / openai.jarvis.lan → 192.168.86.10:80 → container 8000
apiVersion: v1
kind: Service
metadata:
  name: llm-api
  labels:
    app.kubernetes.io/name: jarvis-llm-api
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.86.10"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: jarvis-llm-api

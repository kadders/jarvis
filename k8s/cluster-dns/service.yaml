apiVersion: v1
kind: Service
metadata:
  name: cluster-dns
  labels:
    app.kubernetes.io/name: jarvis-cluster-dns
    app.kubernetes.io/component: lan-dns
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jarvis-cluster-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP

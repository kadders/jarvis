apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-docs
  labels:
    app.kubernetes.io/name: jarvis-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jarvis-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jarvis-docs
    spec:
      containers:
        - name: nginx
          image: jarvis_docs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: 64Mi
              cpu: "50m"

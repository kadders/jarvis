apiVersion: apps/v1
kind: Deployment
metadata:
  name: oximeter-collector
  labels:
    app.kubernetes.io/name: jarvis-oximeter-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jarvis-oximeter-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jarvis-oximeter-collector
    spec:
      containers:
        - name: oximeter-collector
          image: jarvis_oximeter_collector:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
              name: http
          envFrom:
            - configMapRef:
                name: jarvis-oximeter-collector-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: "50m"
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/cache/oximeter
      volumes:
        - name: data
          emptyDir: {}

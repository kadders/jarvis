apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-redpanda-config
  labels:
    app.kubernetes.io/name: redpanda
data:
  redpanda.yaml: |
    redpanda:
      data_directory: /var/lib/redpanda/data
      seed_servers: []
      rpc_server:
        address: 0.0.0.0
        port: 33145
      kafka_api:
        - address: 0.0.0.0
          port: 9092
      admin:
        - address: 0.0.0.0
          port: 9644
      developer_mode: true
    pandaproxy: {}
    schema_registry: {}

# Machine-agnostic tap-testing stack: MQTT + collector + stream + Redpanda + bridge.
# Site-specific LB / NFS: use a profile overlay (e.g. gpu-rig-telemetry) or your own.
# Images are rewritten at deploy time by ./deploy.sh from REGISTRY / IMAGE_TAG.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../mosquitto
  - ../../tap-collector
  - ../../tap-stream
  - ../../redpanda
  - ../../telemetry-bridge

labels:
  - pairs:
      app.kubernetes.io/part-of: jarvis
      app.kubernetes.io/component: tap-testing
    includeSelectors: false

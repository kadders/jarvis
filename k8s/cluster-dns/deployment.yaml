apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-dns
  labels:
    app.kubernetes.io/name: jarvis-cluster-dns
    app.kubernetes.io/component: lan-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jarvis-cluster-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jarvis-cluster-dns
        app.kubernetes.io/component: lan-dns
    spec:
      containers:
        - name: coredns
          image: coredns/coredns:1.11.3
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - all
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
          resources:
            requests:
              memory: 32Mi
              cpu: "20m"
            limits:
              memory: 128Mi
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: jarvis-cluster-dns

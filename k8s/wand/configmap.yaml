apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-wand-config
  labels:
    app.kubernetes.io/name: jarvis-wand
data:
  WAND_API_HOST: "0.0.0.0"
  WAND_API_PORT: "8002"
  WAND_ASR_BASE_URL: "http://asr:8001"
  WAND_GESTURE_MODEL_PATH: "/app/models/wand_gesture"
  WAND_FUSION_ALPHA: "0.65"
  WAND_FUSION_BETA: "0.35"
  WAND_CAST_THRESHOLD: "0.55"
  JARVIS_CONFIG_DIR: "/etc/jarvis/config"
  JARVIS_CONFIG_RELOAD_INTERVAL_S: "30"

# Optional TLS listener — mount TLS secret and enable via kustomize patch.
# Generate certs (lab example):
#   openssl req -new -x509 -days 3650 -extensions v3_ca \
#     -keyout ca.key -out ca.crt -subj "/CN=jarvis-mqtt-ca"
#   openssl genrsa -out server.key 2048
#   openssl req -new -key server.key -out server.csr -subj "/CN=mqtt.jarvis.lan"
#   openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
#     -out server.crt -days 825
#
# Kubernetes secret (namespace jarvis-llm):
#   kubectl create secret tls jarvis-mqtt-tls --cert=server.crt --key=server.key
#
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/tls.crt
keyfile /mosquitto/certs/tls.key
require_certificate false
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

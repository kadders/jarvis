# Optional dynamic PVCs for model weights (adjust storageClassName for your cluster).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-llm-models
  labels:
    app.kubernetes.io/name: jarvis-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-asr-models
  labels:
    app.kubernetes.io/name: jarvis-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard

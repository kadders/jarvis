# Portable oximeter / health collector. Site LB/NFS via profile overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../oximeter-collector

labels:
  - pairs:
      app.kubernetes.io/part-of: jarvis
      app.kubernetes.io/component: health
    includeSelectors: false

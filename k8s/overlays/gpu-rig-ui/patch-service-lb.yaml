# Expose chat UI on the LAN via MetalLB (pinned IP; see docs/operations/cluster-dns.md).
# Name: ui.jarvis.lan / chat.jarvis.lan → 192.168.86.6:80 → container 8003
#
# Port must be replaced via JSON6902 (not strategic merge): Service ports merge on
# `port`, so changing 8003→80 would otherwise leave both entries named "http".
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: jarvis-ui
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.86.6"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: jarvis-ui

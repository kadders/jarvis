# Big tier MODEL_NAME is llama3.1:8b for ollama/ollama:0.4.7 (Pascal PoC).
# gpt-oss:20b needs a newer Ollama image (HTTP 412 on 0.4.7) — see docs/operations/kubernetes.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-llm-api-config
  labels:
    app.kubernetes.io/name: jarvis-llm-api
data:
  MODEL_TYPE: "ollama"
  MODEL_NAME: "llama3.1:8b"
  OLLAMA_BASE_URL: "http://ollama:11434/v1"
  MODEL_NAME_FAST: "llama3.2:3b"
  OLLAMA_FAST_BASE_URL: "http://ollama-fast:11434/v1"
  IDEMPOTENCY_BACKEND: "redis"
  REDIS_URL: "redis://redis:6379/0"
  JARVIS_CONFIG_DIR: "/etc/jarvis/config"
  JARVIS_CONFIG_RELOAD_INTERVAL_S: "30"
  JARVIS_FEEDBACK_DIR: "/var/jarvis/feedback"
  JARVIS_FEEDBACK_MAX_INJECT: "3"
